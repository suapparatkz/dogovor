<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Келісімшарт генераторы</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff}
body{background:#fff}
.scr{display:none}
.scr.active{display:block}
input,select{font-size:16px;background:#ffffff !important;color:#0f172a !important;color-scheme:light}
input::placeholder{color:#94a3b8}
</style>
</head>
<body class="min-h-screen bg-white text-slate-800">

<div id="formScr" class="scr active max-w-2xl mx-auto px-4 py-8 pb-16">
  <h1 class="text-xl md:text-2xl font-bold mb-1 text-center">Компания мен Клиент арасындағы келісімшартты жасау шаблоны</h1>
  <p class="text-center text-slate-500 text-sm mb-6">Барлық өрістерді толтырыңыз</p>
  <form id="cForm" class="space-y-4" novalidate>
    <div><label class="block text-sm font-medium mb-1">Келісімшарт № *</label>
      <input required id="f_num" class="w-full border rounded-lg px-3 py-2" placeholder="000000320"></div>
    <div><label class="block text-sm font-medium mb-1">Келісімшартқа отырған күн *</label>
      <input required type="date" id="f_date" class="w-full border rounded-lg px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Клиенттің толық аты-жөні *</label>
      <input required id="f_fio" class="w-full border rounded-lg px-3 py-2" placeholder="Тегі Аты Әкесінің аты"></div>
    <div><label class="block text-sm font-medium mb-1">Келісімшарт сомасы, теңге *</label>
      <input required type="number" min="1" id="f_sum" class="w-full border rounded-lg px-3 py-2" placeholder="1400000"></div>
    <div><label class="block text-sm font-medium mb-1">Жеткізу қаласы *</label>
      <input required id="f_city" class="w-full border rounded-lg px-3 py-2" placeholder="Ақтау"></div>
    <div><label class="block text-sm font-medium mb-1">ЖСН / ИИН (дәл 12 цифр) *</label>
      <input required inputmode="numeric" maxlength="12" pattern="\d{12}" title="ИИН дәл 12 саннан тұруы керек" id="f_iin" class="w-full border rounded-lg px-3 py-2" placeholder="123456789012"></div>
    <div><label class="block text-sm font-medium mb-1">Байланыс телефоны (+ дан кейін дәл 11 цифр) *</label>
      <div class="flex items-center gap-2 border rounded-lg px-3 py-2 bg-white">
        <span class="text-slate-500">+</span>
        <input required inputmode="numeric" maxlength="11" pattern="\d{11}" title="Телефон + дан кейін дәл 11 саннан тұруы керек" id="f_phone" class="w-full outline-none bg-white" placeholder="77026462455">
      </div></div>
    <div><label class="block text-sm font-medium mb-1">Аппарат түрі *</label>
      <select required id="f_type" class="w-full border rounded-lg px-3 py-2 bg-white">
        <option value="">— таңдаңыз —</option>
        <option value="street">Водомат уличный PapaSu</option>
        <option value="room">Водомат помещения PapaSu</option>
        <option value="wall">Водомат навесной PapaSu</option>
      </select></div>
    <div><label class="block text-sm font-medium mb-1">Аппарат өнімділігі *</label>
      <select required id="f_prod" class="w-full border rounded-lg px-3 py-2 bg-white">
        <option value="">— таңдаңыз —</option>
        <option value="60 л/ч">60 л/ч</option>
        <option value="120 л/ч">120 л/ч</option>
      </select></div>
    <div class="pt-2 space-y-3">
      <button type="button" id="btnWord" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-3 font-semibold">⬇ Word жүктеу (.docx)</button>
    </div>
  </form>
</div>

function numToWordsRu(num){
  if(num===0)return'ноль';
  const ones=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
  const onesF=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'];
  const teens=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const hund=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  function triple(n,fem){
    let s=[],h=Math.floor(n/100),t=Math.floor((n%100)/10),o=n%10;
    if(h)s.push(hund[h]);
    if(t===1){s.push(teens[o]);}else{if(t)s.push(tens[t]);if(o)s.push(fem?onesF[o]:ones[o]);}
    return s.join(' ');
  }
  function plural(n,f1,f2,f5){
    let n100=n%100,n10=n%10;
    if(n100>=11&&n100<=14)return f5;
    if(n10===1)return f1;
    if(n10>=2&&n10<=4)return f2;
    return f5;
  }
  const scales=[
    {div:1e9,f:['миллиард','миллиарда','миллиардов'],fem:false},
    {div:1e6,f:['миллион','миллиона','миллионов'],fem:false},
    {div:1e3,f:['тысяча','тысячи','тысяч'],fem:true}
  ];
  let n=Math.floor(num),parts=[];
  for(const sc of scales){
    let v=Math.floor(n/sc.div);
    if(v>0){
      let tr=triple(v,sc.fem),w=plural(v,sc.f[0],sc.f[1],sc.f[2]);
      parts.push((tr?tr+' ':'')+w);
    }
    n=n%sc.div;
  }
  if(n>0||parts.length===0)parts.push(triple(n,false));
  return parts.join(' ').replace(/\s+/g,' ').trim();
}

async function generatePdfBlob(d){
  const container=document.createElement('div');
  container.style.position='fixed';container.style.left='-9999px';container.style.top='0';
  container.style.width='794px';container.style.background='#fff';container.style.padding='60px 70px';
  container.style.fontFamily="'Times New Roman',Times,serif";container.style.fontSize='15px';
  container.style.lineHeight='1.45';container.style.color='#111';
  container.innerHTML=buildHtml(d);
  document.body.appendChild(container);
  const canvas=await html2canvas(container,{scale:2,useCORS:true});
  document.body.removeChild(container);
  const ctx=canvas.getContext('2d');
  const imgW=210,pageH=297;
  const pxPerMm=canvas.width/imgW;
  const idealH=Math.floor((pageH-8)*pxPerMm); /* small bottom margin so text never touches the edge */
  const searchBand=Math.round(14*pxPerMm); /* look up to ~14mm back for a blank row to break on */
  function isRowBlank(y){
    const row=ctx.getImageData(0,y,canvas.width,1).data;
    for(let x=0;x<row.length;x+=32){ /* sample every 8th pixel */
      if(row[x]<245||row[x+1]<245||row[x+2]<245)return false;
    }
    return true;
  }
  function findBreak(y){
    const idealEnd=Math.min(y+idealH,canvas.height);
    if(idealEnd>=canvas.height)return idealEnd;
    const from=Math.max(y+1,idealEnd-searchBand);
    for(let r=idealEnd;r>=from;r--){ if(isRowBlank(r)) return r; }
    return idealEnd; /* no blank row found: fall back to a hard cut */
  }
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4'});
  let y=0,first=true;
  while(y<canvas.height){
    const end=findBreak(y);
    const sliceH=Math.max(1,end-y);
    const c=document.createElement('canvas');
    c.width=canvas.width;c.height=sliceH;
    c.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
    const imgData=c.toDataURL('image/jpeg',0.92);
    if(!first)pdf.addPage();
    pdf.addImage(imgData,'JPEG',0,0,imgW,sliceH/pxPerMm);
    y=end;first=false;
  }
  return pdf.output('blob');
}

/* ---------- DOCX ---------- */
async function makeDocxBlob(d){
  const {Document,Packer,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,AlignmentType,WidthType,BorderStyle,PageBreak,HorizontalPositionRelativeFrom,VerticalPositionRelativeFrom,TextWrappingType}=docx;
  const F='Times New Roman';
  const noB={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const NB={top:noB,bottom:noB,left:noB,right:noB};
  const thinB={style:BorderStyle.SINGLE,size:2,color:'000000'};
  const CB={top:thinB,bottom:thinB,left:thinB,right:thinB};
  const CM={top:120,bottom:120,left:150,right:150};

  function p(text,{align,bold=false,indent=true,size=22,center=false}={}){
    return new Paragraph({alignment:center?AlignmentType.CENTER:(align||AlignmentType.JUSTIFIED),indent:indent?{firstLine:480}:undefined,spacing:{after:120},children:[new TextRun({text,bold,size,font:F})]});
  }
  function headTable(left,right){
    return new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({children:[
      new TableCell({borders:NB,children:[new Paragraph({children:[new TextRun({text:left,font:F,size:22})]})]}),
      new TableCell({borders:NB,children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:right,font:F,size:22,bold:true})]})]})
    ]})]});
  }
  function reqTable(d){
    const L=['ПОСТАВЩИК:','ИП BYSAILAU','Адрес: Казахстан, Актобе,','ПРОСПЕКТ АБИЛКАЙЫР ХАНА, дом 63','БИН (ИИН): 011012551344','Банк: АО "Kaspi Bank"','КБе: 19','БИК: CASPKZKA','Номер счёта: KZ53722S000018511920','','Директор'];
    const R=[`ПОКУПАТЕЛЬ: ${d.fio}`,`ИИН: ${d.iin}`,`Телефон: ${d.phone}`];
    const mkL=(lines)=>lines.map((l,i)=>new Paragraph({spacing:i===0?{before:200}:undefined,children:[new TextRun({text:l,font:F,size:20,bold:(l==='ПОСТАВЩИК:'||l==='Директор')})]}));
    const sigPara=new Paragraph({children:[
      new TextRun({text:'_____________ Сайлауов М.Ж',font:F,size:20}),
      new ImageRun({
        data:SIGNATURE_URI,
        transformation:{width:90,height:51},
        floating:{
          horizontalPosition:{relative:HorizontalPositionRelativeFrom.CHARACTER,offset:-1550000},
          verticalPosition:{relative:VerticalPositionRelativeFrom.LINE,offset:-180000},
          wrap:{type:TextWrappingType.NONE},
          behindDocument:true,
          allowOverlap:true,
          zIndex:2
        }
      }),
      new ImageRun({
        data:STAMP_URI,
        transformation:{width:140,height:146},
        floating:{
          horizontalPosition:{relative:HorizontalPositionRelativeFrom.CHARACTER,offset:-500000},
          verticalPosition:{relative:VerticalPositionRelativeFrom.LINE,offset:-420000},
          wrap:{type:TextWrappingType.NONE},
          behindDocument:true,
          allowOverlap:true,
          zIndex:1
        }
      })
    ]});
    const mkR=(lines)=>lines.map((l,i)=>new Paragraph({spacing:i===0?{before:200}:undefined,children:[new TextRun({text:l,font:F,size:20})]}));
    return new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[new TableRow({children:[
      new TableCell({borders:NB,width:{size:50,type:WidthType.PERCENTAGE},children:[...mkL(L),sigPara]}),
      new TableCell({borders:NB,width:{size:50,type:WidthType.PERCENTAGE},children:mkR(R)})
    ]})]});
  }
  function cell(text,{bold=false,align=AlignmentType.CENTER}={}){
    return new TableCell({borders:CB,margins:CM,children:[new Paragraph({alignment:align,children:[new TextRun({text:String(text),bold,font:F,size:20})]})]});
  }

  const children=[];
  children.push(p(`ДОГОВОР ПОСТАВКИ №${d.num}`,{center:true,bold:true,indent:false,size:26}));
  children.push(headTable('г. Астана',d.dateStr));
  children.push(p(introText(d)));
  for(const [title,paras] of sections(d)){
    children.push(p(title,{center:true,bold:true,indent:false}));
    for(const t of paras) children.push(p(t));
  }
  children.push(p('9. РЕКВИЗИТЫ СТОРОН:',{center:true,bold:true,indent:false}));
  children.push(reqTable(d));

  children.push(new Paragraph({children:[new PageBreak()]}));
  children.push(p('ПРИЛОЖЕНИЕ № 1',{center:true,bold:true,indent:false}));
  children.push(p(`к ДОГОВОРУ ПОСТАВКИ №${d.num} от ${d.year} года`,{center:true,bold:true,indent:false}));
  children.push(headTable('г. Астана',d.dateStr));
  children.push(p('Спецификация на поставляемое оборудование',{center:true,bold:true,indent:false}));
  children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
    new TableRow({children:[cell('№',{bold:true}),cell('Наименование',{bold:true}),cell('Ед.изм.',{bold:true}),cell('Кол-во',{bold:true}),cell('Цена за ед., тенге',{bold:true}),cell('Сумма, тенге',{bold:true})]}),
    new TableRow({children:[cell('1'),cell(d.device.name,{align:AlignmentType.LEFT}),cell('Шт.'),cell('1'),cell(d.sumFmt),cell(d.sumFmt)]}),
    new TableRow({children:[cell('2'),cell('Услуги',{align:AlignmentType.LEFT}),cell('Шт.'),cell('0'),cell('0'),cell('0')]}),
    new TableRow({children:[new TableCell({borders:CB,margins:CM,columnSpan:5,children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'Итого:',bold:true,font:F,size:20})]})]}),cell(d.sumFmt,{bold:true})]})
  ]}));
  children.push(new Paragraph({spacing:{before:300},children:[]}));
  children.push(reqTable(d));

  children.push(new Paragraph({children:[new PageBreak()]}));
  children.push(p('ПРИЛОЖЕНИЕ № 2',{center:true,bold:true,indent:false}));
  children.push(p(`к ДОГОВОРУ ПОСТАВКИ №${d.num} от ${d.year} года`,{center:true,bold:true,indent:false}));
  children.push(headTable('г. Астана',d.dateStr));
  children.push(p('ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ ОБОРУДОВАНИЯ',{center:true,bold:true,indent:false}));
  for(const t of d.device.tanks){
    children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
      new TableRow({children:[new TableCell({borders:CB,margins:CM,columnSpan:2,children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:t.title,bold:true,font:F,size:20})]})]})]}),
      new TableRow({children:[cell('Наименование',{bold:true,align:AlignmentType.LEFT}),cell('Количество',{bold:true})]}),
      new TableRow({children:[cell('Высота, см',{align:AlignmentType.LEFT}),cell(t.h)]}),
      new TableRow({children:[cell('Ширина, см',{align:AlignmentType.LEFT}),cell(t.w)]}),
      new TableRow({children:[cell('Глубина, см',{align:AlignmentType.LEFT}),cell(t.d)]})
    ]}));
    children.push(p('',{indent:false}));
  }
  children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
    new TableRow({children:[cell('Детали',{bold:true,align:AlignmentType.LEFT}),cell(d.device.name,{bold:true,align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Производительность',{align:AlignmentType.LEFT}),cell(d.prod,{align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Объем бака',{align:AlignmentType.LEFT}),cell(d.device.tank+' л',{align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Этапы очистки',{align:AlignmentType.LEFT}),cell('8 этап',{align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Фильтры 5мм, уголь, 1 мм',{align:AlignmentType.LEFT}),cell('15000-17000 литр (по счетчику), раз 1-2 месяца',{align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Мембрана',{align:AlignmentType.LEFT}),cell('75000 литр (по счетчику), раз в пол года или год',{align:AlignmentType.LEFT})]}),
    new TableRow({children:[cell('Пост фильтр',{align:AlignmentType.LEFT}),cell('75000 литр (по счетчику), раз в пол года или год',{align:AlignmentType.LEFT})]})
  ]}));
  children.push(new Paragraph({spacing:{before:300},children:[]}));
  children.push(reqTable(d));

  const doc=new Document({sections:[{properties:{},children}]});
  return await Packer.toBlob(doc);
}

/* ---------- wiring ---------- */
['f_iin','f_phone'].forEach(id=>{
  document.getElementById(id).addEventListener('input',e=>{
    const max=id==='f_iin'?12:11;
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,max);
  });
});

document.getElementById('cForm').addEventListener('submit',e=>e.preventDefault());

function validateForm(){
  const form=document.getElementById('cForm');
  if(!form.reportValidity())return false;
  return true;
}

let downloadsCap=null;
(async()=>{try{downloadsCap=await claude.use('downloads');}catch(e){}})();

async function offerDownload(blob,filename){
  try{
    if(!downloadsCap){try{downloadsCap=await claude.use('downloads');}catch(e){}}
    if(downloadsCap){await downloadsCap.save({filename,data:blob});return;}
  }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
}

document.getElementById('btnWord').onclick=async()=>{
  if(!validateForm())return;
  DATA=buildData();
  const btn=document.getElementById('btnWord');const old=btn.textContent;
  btn.disabled=true;btn.textContent='Дайындалуда...';
  try{
    const blob=await makeDocxBlob(DATA);
    await offerDownload(blob,`Dogovor_${DATA.num}.docx`);
  }catch(err){alert('Қате: '+err.message);}
  btn.disabled=false;btn.textContent=old;
};
